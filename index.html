<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sankalp | Shrikhand Mahadev Prep</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Inter:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Neumorphic Palette */
            --bg: #e6e9ef;
            --shadow-light: #ffffff;
            --shadow-dark: #b8bec9;
            --accent: #5e72e4;
            --danger: #f5365c;
            --success: #2dce89;
            --text-main: #2d3436;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg); 
            color: var(--text-main);
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .logo-font {
            font-family: 'Cinzel Decorative', cursive;
            position: relative;
            display: inline-block;
            letter-spacing: 2px;
        }
        /* The Shirorekha (Horizontal line) across the top */
        .logo-font::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -5%;
            width: 110%;
            height: 2px;
            background: var(--text-main);
            opacity: 0.8;
        }

        .neu-flat {
            background: var(--bg);
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
        }
        .neu-pressed {
            background: var(--bg);
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
        }
        .neu-btn {
            background: var(--bg);
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            transition: all 0.2s ease;
        }
        .neu-btn:active {
            box-shadow: inset 2px 2px 4px var(--shadow-dark), inset -2px -2px 4px var(--shadow-light);
        }

        .sidebar {
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateX(-100%);
        }
        .sidebar.open {
            transform: translateX(0);
        }

        .locked-phase {
            filter: grayscale(1) opacity(0.5);
            pointer-events: none;
        }

        /* Custom Checkbox Styling */
        input[type="checkbox"] {
            width: 22px; height: 22px;
            appearance: none;
            background: var(--bg);
            box-shadow: 2px 2px 4px var(--shadow-dark), -2px -2px 4px var(--shadow-light);
            border-radius: 6px;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
        }
        input[type="checkbox"]:checked {
            box-shadow: inset 2px 2px 4px var(--shadow-dark), inset -2px -2px 4px var(--shadow-light);
        }
        input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            left: 5px; top: -1px;
            color: var(--accent);
            font-weight: 900;
            font-size: 14px;
        }
    </style>
</head>
<body class="pb-10">

    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/30 backdrop-blur-sm z-[60] hidden"></div>
    <aside id="sidebar" class="sidebar fixed top-0 left-0 h-full w-72 bg-[#e6e9ef] z-[70] p-6 shadow-2xl overflow-y-auto">
        <div class="mb-8">
            <h2 class="logo-font text-2xl text-slate-700">SANKALP</h2>
            <p class="text-[10px] text-slate-400 mt-2 font-bold tracking-widest uppercase">Mission Navigator</p>
        </div>
        <nav id="sidebar-nav" class="space-y-4">
            <!-- Phases injected dynamically -->
        </nav>
    </aside>

    <header class="p-6 sticky top-0 bg-[#e6e9ef]/90 backdrop-blur-md z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <button onclick="toggleSidebar()" class="w-12 h-12 neu-btn rounded-xl flex items-center justify-center text-xl">☰</button>
            <div class="text-center">
                <h1 class="logo-font text-2xl text-slate-800">SANKALP</h1>
                <div id="status-container" class="flex items-center justify-center gap-2 mt-1">
                    <div id="status-dot" class="w-2 h-2 rounded-full bg-success"></div>
                    <span id="global-status" class="text-[10px] uppercase font-black tracking-widest text-slate-500">Status: Optimal</span>
                </div>
            </div>
            <button onclick="toggleSettings()" class="w-12 h-12 neu-btn rounded-xl flex items-center justify-center text-xl">⚙️</button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">

        <section class="neu-flat p-6 rounded-[2.5rem] space-y-5">
            <div class="flex justify-between items-center border-b border-slate-200 pb-4">
                <div>
                    <p id="mission-day" class="text-[10px] uppercase font-black text-slate-400 tracking-widest mb-1">Day 01</p>
                    <h2 id="display-date" class="text-xl font-bold text-slate-700">June 2, 2026</h2>
                </div>
                <div class="flex gap-2">
                    <button onclick="changeDate(-1)" class="w-10 h-10 neu-btn rounded-full flex items-center justify-center">←</button>
                    <button onclick="changeDate(1)" class="w-10 h-10 neu-btn rounded-full flex items-center justify-center">→</button>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="neu-pressed p-4 rounded-3xl">
                    <p class="text-[9px] uppercase font-black text-slate-400 mb-1">Current Mass</p>
                    <div class="flex items-end gap-1">
                        <input type="number" id="weight-input" step="0.01" class="w-full bg-transparent text-xl font-black text-slate-700 focus:outline-none" placeholder="00.0">
                        <span class="text-xs font-bold text-slate-400">kg</span>
                    </div>
                </div>
                <div class="neu-pressed p-4 rounded-3xl">
                    <p class="text-[9px] uppercase font-black text-slate-400 mb-1">Sadhana XP</p>
                    <div class="flex items-end gap-1">
                        <span id="xp-stat" class="text-xl font-black text-slate-700">0</span>
                        <span class="text-xs font-bold text-slate-400">pts</span>
                    </div>
                </div>
            </div>

            <div class="space-y-4">
                <div class="flex items-center justify-between">
                    <h3 class="text-[11px] font-black uppercase text-slate-400 tracking-widest">Phase Milestones</h3>
                    <span id="active-phase-badge" class="bg-accent text-white text-[9px] font-black px-3 py-1 rounded-full uppercase tracking-tighter shadow-lg shadow-blue-200">Phase 1</span>
                </div>
                <div id="milestones-container" class="space-y-3">
                    <!-- Milestones Injected -->
                </div>
            </div>
        </section>

        <section class="neu-flat p-6 rounded-[2.5rem] space-y-4">
            <h3 class="text-[11px] font-black uppercase text-slate-400 tracking-widest">Daily Quests</h3>
            <div id="quests-list" class="space-y-3">
                <!-- Quests Injected -->
            </div>
        </section>

        <section id="details-display" class="space-y-6">
            <h2 id="phase-title" class="text-lg font-black text-slate-700 uppercase px-2 border-l-4 border-accent">1: Recovery Foundation</h2>

            <div class="neu-flat p-6 rounded-[2.5rem] space-y-3">
                <h4 class="text-[11px] font-black text-slate-400 uppercase tracking-widest flex items-center gap-2">🏋️ Training Protocol</h4>
                <div id="training-content" class="text-xs leading-relaxed text-slate-600 space-y-2"></div>
            </div>

            <div class="neu-flat p-6 rounded-[2.5rem] space-y-3">
                <h4 class="text-[11px] font-black text-slate-400 uppercase tracking-widest flex items-center gap-2">🥗 Fuel & Belly Burn</h4>
                <div id="fuel-content" class="text-xs leading-relaxed text-slate-600 space-y-2"></div>
            </div>

            <div class="neu-pressed p-6 rounded-[2.5rem] border border-red-200">
                <h4 class="text-[11px] font-black text-red-400 uppercase tracking-widest flex items-center gap-2">🚫 Forbidden List</h4>
                <div id="forbidden-content" class="text-xs italic leading-relaxed text-red-800/80 space-y-2"></div>
            </div>
        </section>
    </main>

    <div id="settings-modal" class="fixed inset-0 bg-[#e6e9ef]/95 backdrop-blur-md z-[100] hidden flex items-center justify-center p-6">
        <div class="neu-flat p-8 rounded-[3rem] w-full max-w-xs space-y-6">
            <h2 class="text-xl font-black text-slate-700 text-center uppercase tracking-tighter">Initialize Sankalp</h2>
            <div>
                <label class="text-[10px] uppercase font-bold text-slate-500 mb-2 block text-center">Mission Start Date</label>
                <div class="neu-pressed p-3 rounded-xl">
                    <input type="date" id="start-date-input" class="w-full bg-transparent border-none text-center focus:outline-none">
                </div>
            </div>
            <button onclick="saveSettings()" class="w-full p-4 neu-btn rounded-2xl text-accent font-black uppercase text-sm">Save Config</button>
            <button onclick="toggleSettings()" class="w-full text-slate-400 text-[10px] uppercase mt-2">Close</button>
        </div>
    </div>

    <script>
        let state = {
            startDate: localStorage.getItem('sankalp_start_v1') || "",
            unlockedPhase: parseInt(localStorage.getItem('sankalp_unlocked_v1')) || 1,
            history: JSON.parse(localStorage.getItem('sankalp_history_v1')) || {},
            currentDate: new Date().toISOString().split('T')[0],
            gates: JSON.parse(localStorage.getItem('sankalp_gates_v1')) || {},
            viewingPhase: parseInt(localStorage.getItem('sankalp_unlocked_v1')) || 1
        };

        const PHASES = [
            null,
            { 
                title: "1: Recovery Foundation",
                milestones: ["Muscle spasms fully resolved", "Weight ≤ 69.8 kg", "No neck pain during 30m walk"],
                quests: ["15m Mobility (Chin Tucks/Cat-Cow)", "Hourly 2m Desk Stand-up", "120g Protein Intake", "3.5L Water Intake", "Zero Sugar Day"],
                training: "<b>Focus:</b> Spinal realignment and healing pectoral trauma.<br>• Perform 10 chin-tucks every hour at your desk.<br>• Open-book stretches (3x10 each side) to open chest.<br>• 30-minute flat walks only.",
                fuel: "<b>Anti-Inflammatory:</b> Prioritize Turmeric, Ginger, and Omega-3s. Eliminate refined carbs. To lose the belly, start tracking calories to hit ~2,000 kcal.",
                forbidden: "• NO Running (impact triggers spasms).<br>• NO Overhead Lifting.<br>• NO Late night heavy dinners.<br>• NO Slouching at your desk."
            },
            { 
                title: "2: Oxygen Thief (Fat Burn)",
                milestones: ["Weight ≤ 68.2 kg", "45m Incline Walk @ 10% Incline", "Zero knee/neck pain during incline"],
                quests: ["45m Fasted Incline Treadmill", "Knee Step-downs (3x20)", "Intermittent Fasting (16:8)", "No Refined Carbs / Seed Oils"],
                training: "<b>The Belly Incinerator:</b> Incline walking is the secret. Gym treadmill: Incline 8-12%, Speed 4.0 km/h. <br>• Knee Protection: Poliquin step-downs are mandatory for the left knee.",
                fuel: "<b>Fat Adaptation:</b> 16/8 Intermittent Fasting. First meal at 1 PM. This aggressively targets abdominal fat. High protein to preserve muscle.",
                forbidden: "• NO Snacks between meals.<br>• NO skipping leg mobility.<br>• NO high-impact jumping exercises."
            },
            { 
                title: "3: Iron Sherpa (Strength)",
                milestones: ["Weight ≤ 67.0 kg", "60m Incline Walk with 5kg Pack", "Core Plank 2-Minute Hold"],
                quests: ["Weighted Stair Climb (5kg)", "Dumbbell Suitcase Carries", "Core Stability Circuit (10m)", "Post-Workout Protein Shake"],
                training: "<b>Functional Loading:</b> Carry 5kg in your pack. Focus on the core to support the weight so your neck doesn't take the load.<br>• Suitcase Carries: Walk 20m with 10kg in one hand.",
                fuel: "<b>Clean Performance:</b> Complex carbs only on training days. High fiber intake to stay full during the office hours.",
                forbidden: "• NO ego-lifting weights.<br>• NO alcohol (kills recovery).<br>• NO poor sleep (< 7 hours)."
            },
            { 
                title: "4: Apex Predator (Summit)",
                milestones: ["Weight ≤ 65.5 kg", "3-Hour Weighted Pack Hike (12kg)", "Summit Ready: 1,000m Gain"],
                quests: ["3-Hour Heavy Pack Simulation", "Full Body Mobility Flush", "Precision Macro Tracking", "Mental Grit (Cold Shower)"],
                training: "<b>Peak Simulation:</b> This is the final 100% readiness phase. 3-hour weekend sessions with a 12kg pack on stairs or hills. Use trekking poles for every step.",
                fuel: "<b>Trail Metabolism:</b> Practice trail-eating (nuts/seeds) to train your stomach for high-altitude stress.",
                forbidden: "• NO new gear (must be broken in).<br>• NO skipping rest days.<br>• NO negative self-talk."
            }
        ];

        window.onload = () => {
            if (!state.startDate) toggleSettings();
            renderSidebar();
            updateUI();
        };

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebar-overlay').classList.toggle('hidden');
        }

        function toggleSettings() {
            document.getElementById('settings-modal').classList.toggle('hidden');
        }

        function saveSettings() {
            const date = document.getElementById('start-date-input').value;
            if (!date) return;
            state.startDate = date;
            localStorage.setItem('sankalp_start_v1', date);
            toggleSettings();
            updateUI();
        }

        function changeDate(dir) {
            let d = new Date(state.currentDate);
            d.setDate(d.getDate() + dir);
            state.currentDate = d.toISOString().split('T')[0];
            updateUI();
        }

        function saveDailyData() {
            const date = state.currentDate;
            const questsData = {};
            const activeP = PHASES[state.unlockedPhase];
            activeP.quests.forEach((q, idx) => {
                const el = document.getElementById(`q-${idx}`);
                if (el) questsData[idx] = el.checked;
            });

            state.history[date] = {
                quests: questsData,
                weight: parseFloat(document.getElementById('weight-input').value) || null
            };
            localStorage.setItem('sankalp_history_v1', JSON.stringify(state.history));
            updateStats();
        }

        function toggleGate(phaseIdx, milestoneIdx) {
            const key = `gate_${phaseIdx}_${milestoneIdx}`;
            state.gates[key] = !state.gates[key];
            localStorage.setItem('sankalp_gates_v1', JSON.stringify(state.gates));
            
            // Check if all milestones of current phase are met
            const currentMilestones = PHASES[state.unlockedPhase].milestones;
            let allMet = true;
            currentMilestones.forEach((_, idx) => {
                if (!state.gates[`gate_${state.unlockedPhase}_${idx}`]) allMet = false;
            });

            if (allMet && state.unlockedPhase < 4) {
                state.unlockedPhase++;
                state.viewingPhase = state.unlockedPhase;
                localStorage.setItem('sankalp_unlocked_v1', state.unlockedPhase);
                notify("SANKALP ACHIEVED", `Phase ${state.unlockedPhase} has been unlocked. Continue your determination.`);
            }
            renderSidebar();
            updateUI();
        }

        function renderSidebar() {
            const nav = document.getElementById('sidebar-nav');
            nav.innerHTML = "";
            for(let i=1; i<=4; i++) {
                const isLocked = i > state.unlockedPhase;
                const isActive = i === state.viewingPhase;
                nav.innerHTML += `
                    <button onclick="${isLocked ? '' : `switchView(${i})`}" 
                        class="w-full text-left p-4 rounded-2xl flex items-center justify-between transition-all ${isActive ? 'neu-pressed text-accent' : 'neu-btn text-slate-500'} ${isLocked ? 'locked-phase' : ''}">
                        <div class="flex flex-col">
                            <span class="text-[9px] uppercase font-black opacity-60">Phase ${i}</span>
                            <span class="text-xs font-bold">${PHASES[i].title.split(':')[1] || PHASES[i].title}</span>
                        </div>
                        ${isLocked ? '🔒' : (i < state.unlockedPhase ? '✅' : '🎯')}
                    </button>
                `;
            }
        }

        function switchView(idx) {
            state.viewingPhase = idx;
            toggleSidebar();
            updateUI();
        }

        function updateUI() {
            const dateObj = new Date(state.currentDate);
            document.getElementById('display-date').innerText = dateObj.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
            
            if (state.startDate) {
                const start = new Date(state.startDate);
                const diff = Math.floor((dateObj - start) / (86400000)) + 1;
                document.getElementById('mission-day').innerText = `Mission Day ${diff < 1 ? '0' : diff}`;
            }

            const currentPhase = PHASES[state.unlockedPhase];
            const viewPhase = PHASES[state.viewingPhase];

            document.getElementById('active-phase-badge').innerText = `PHASE ${state.unlockedPhase}`;
            document.getElementById('phase-title').innerText = viewPhase.title;
            
            document.getElementById('training-content').innerHTML = viewPhase.training;
            document.getElementById('fuel-content').innerHTML = viewPhase.fuel;
            document.getElementById('forbidden-content').innerHTML = viewPhase.forbidden;

            // Load data for current date
            const log = state.history[state.currentDate] || { quests: {} };
            document.getElementById('weight-input').value = log.weight || "";

            const questList = document.getElementById('quests-list');
            questList.innerHTML = "";
            currentPhase.quests.forEach((q, idx) => {
                const isChecked = log.quests[idx] || false;
                questList.innerHTML += `
                    <div class="flex items-center gap-4 p-4 neu-pressed rounded-2xl">
                        <input type="checkbox" id="q-${idx}" ${isChecked ? 'checked' : ''} onchange="saveDailyData()">
                        <span class="text-xs font-semibold ${isChecked ? 'text-slate-400 line-through' : 'text-slate-600'}">${q}</span>
                    </div>
                `;
            });

            const mContainer = document.getElementById('milestones-container');
            mContainer.innerHTML = "";
            currentPhase.milestones.forEach((m, idx) => {
                const isChecked = state.gates[`gate_${state.unlockedPhase}_${idx}`];
                mContainer.innerHTML += `
                    <div class="flex items-center gap-3 px-1">
                        <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleGate(${state.unlockedPhase}, ${idx})">
                        <span class="text-[11px] leading-tight ${isChecked ? 'text-slate-400 line-through' : 'text-slate-700 font-bold'}">${m}</span>
                    </div>
                `;
            });

            updateStats();
        }

        function updateStats() {
            let xp = 0;
            Object.values(state.history).forEach(day => {
                if (day.quests) Object.values(day.quests).forEach(v => { if(v) xp += 10; });
            });
            document.getElementById('xp-stat').innerText = xp;

            // Check consistency (last 4 days)
            const today = new Date();
            const missionStart = state.startDate ? new Date(state.startDate) : today;
            let missingCount = 0;
            let daysChecked = 0;

            for(let i=0; i<4; i++) {
                let d = new Date();
                d.setDate(today.getDate() - i);
                
                // Only check days that are NOT in the future and NOT before the mission start date
                if (d < missionStart) continue; 
                
                daysChecked++;
                let ds = d.toISOString().split('T')[0];
                const dayLog = state.history[ds];
                const activeQuestsCount = PHASES[state.unlockedPhase].quests.length;
                
                // Count as missing if no log exists or less than half the quests are done
                if (!dayLog || !dayLog.quests || Object.values(dayLog.quests).filter(v => v).length < (activeQuestsCount/2)) {
                    missingCount++;
                }
            }

            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('global-status');
            
            // Logic: Fall behind only if you've been active for a bit and miss 50% of the days checked
            if (daysChecked > 0 && missingCount > (daysChecked / 2)) {
                statusDot.style.backgroundColor = 'var(--danger)';
                statusText.innerText = "Status: Falling Behind";
                statusText.classList.add('text-red-500');
            } else {
                statusDot.style.backgroundColor = 'var(--success)';
                statusText.innerText = "Status: Optimal";
                statusText.classList.remove('text-red-500');
            }
        }

        function notify(title, msg) {
            const div = document.createElement('div');
            div.className = "fixed inset-0 flex items-center justify-center z-[500] p-6 bg-slate-900/40 backdrop-blur-md";
            div.innerHTML = `
                <div class="neu-flat p-8 rounded-[3rem] w-full max-w-xs text-center">
                    <h3 class="logo-font text-xl text-slate-700 mb-2 uppercase">${title}</h3>
                    <p class="text-xs text-slate-500 mb-6 leading-relaxed">${msg}</p>
                    <button class="w-full py-4 neu-btn rounded-2xl text-accent font-black text-xs uppercase" onclick="this.closest('div.fixed').remove()">Acknowledged</button>
                </div>
            `;
            document.body.appendChild(div);
        }
    </script>
</body>
</html>
